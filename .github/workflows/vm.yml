name: Vm

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'zhc_vm/**'
      - '.github/workflows/vm.yml'

env:
  CARGO_TERM_COLOR: always

jobs:

  vm-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
      with:
        persist-credentials: 'false'
    - name: Run tests
      run: make vm-test

  vm-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
      with:
        persist-credentials: 'false'
    - name: Run checks
      run: make vm-check
