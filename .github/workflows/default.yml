name: Default

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
      with:
        persist-credentials: 'false'
        submodules: 'true'
    - name: Install Lean
      uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee #v1.7.1
      with:
        lake-package-directory: zhc_lean
        auto-config: false
        use-mathlib-cache: false
        use-github-cache: false
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Run tests
      run: make all-test

  check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
      with:
        persist-credentials: 'false'
        submodules: 'true'
    - name: Install Lean
      uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee #v1.7.1
      with:
        lake-package-directory: zhc_lean
        auto-config: false
        use-mathlib-cache: false
        use-github-cache: false
    - name: Install libuv
      run: sudo apt-get update && sudo apt-get install -y libuv1-dev
    - name: Run checks
      run: make all-check
