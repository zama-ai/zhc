name: Big Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  big-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout project
      uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 #v6.0.1
      with:
        persist-credentials: 'false'
    - name: Run big tests
      run: make big-test
